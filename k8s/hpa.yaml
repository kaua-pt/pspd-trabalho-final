# --- HPA para Microservice A (Link Shortener) ---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: microservice-a-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: microservice-a
  minReplicas: 1                # Mínimo de 2 réplicas para alta disponibilidade
  maxReplicas: 10               # Máximo de 10 réplicas sob carga
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 25  # Escala quando CPU média > 70%
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 40  # Escala quando memória média > 80%
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 10  # Aguarda 10seg antes de reduzir
      policies:
      - type: Percent
        value: 50                      # Reduz no máximo 50% das réplicas por vez
        periodSeconds: 60
      - type: Pods
        value: 2                       # Ou no máximo 2 pods por vez
        periodSeconds: 60
      selectPolicy: Min                # Escolhe a política mais conservadora
    scaleUp:
      stabilizationWindowSeconds: 0    # Escala imediatamente
      policies:
      - type: Percent
        value: 100                     # Pode dobrar o número de réplicas
        periodSeconds: 30
      - type: Pods
        value: 4                       # Ou adicionar até 4 pods por vez
        periodSeconds: 30
      selectPolicy: Max                # Escolhe a política mais agressiva

